about.label: "Approach"
about.title: "About"
about.p1: "I practice dentistry the way I'd want it for myself — unhurried, precise, and centered on the person in the chair. My clinical work covers scaling and root planing, root canal therapy, restorations, and routine preventive care."
about.p2: "Good dentistry sits at the intersection of science and trust. I take the time to explain every step, listen to what's actually worrying you, and tailor treatment to fit — because clarity and comfort matter as much as the work itself."

services.label: "Care"
services.title: "Services"
services.intro: "Evidence-based dentistry, modern technique, and a steady hand — across the procedures patients ask for most."
services.scaling.title: "Scaling & Cleaning"
services.scaling.desc: "Thorough professional cleaning to lift plaque and tartar, settle inflamed gums, and keep periodontal disease at bay."
services.rct.title: "Root Canal Therapy"
services.rct.desc: "Endodontic treatment for infected or damaged teeth — careful, calm, and aimed at saving the natural tooth."
services.general.title: "General Dentistry"
services.general.desc: "Exams, fillings, restorations, and routine preventive care — the everyday work that keeps a healthy mouth healthy."


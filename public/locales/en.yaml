legal.terms.title: "Terms of Service"
legal.terms.intro: "These terms govern your use of drkyana.com — the website, the AI receptionist, and the patient records area. By using the site you agree to them. Dental care itself is provided in person by Dr Kyana and is governed by professional standards and the applicable law, not by this document."
legal.terms.s1.title: "What this service is"
legal.terms.s1.body: "This site helps you contact Dr Kyana's dental practice: you can describe a dental concern, complete an intake form, request an appointment, and view your own appointments and prescriptions. The site organizes information for the practice — it is not itself a medical provider, and using it does not create a doctor–patient relationship until the practice confirms care."
legal.terms.s2.title: "Not for emergencies"
legal.terms.s2.body: "The site and its AI receptionist are not monitored in real time and must not be used in an emergency. If you have severe bleeding, facial swelling that affects breathing or swallowing, a serious injury, or any other urgent medical problem, go to the nearest hospital emergency department or call the national emergency number 999 immediately."
legal.terms.s3.title: "The AI receptionist"
legal.terms.s3.body: "The receptionist is an AI assistant. It collects the information you choose to share, asks routine intake questions, and gives general logistical information (such as chamber areas and visiting days). It does not diagnose, prescribe, or make clinical decisions. Anything clinical — advice, prescriptions, treatment — comes only from Dr Kyana after she has reviewed your case.\n\nInformation from the assistant is not medical advice, and the assistant can misunderstand or make mistakes; the practice checks every intake before acting on it. When the assistant estimates urgency, that is a routing aid to help the practice respond in the right order — it is not an assessment of your health, and you should never delay seeking care because of it."
legal.terms.s4.title: "Appointments"
legal.terms.s4.body: "Appointment requests made through the site are proposals until the practice confirms them. Locations vary by chamber and are confirmed per booking. If you cannot attend, please tell the practice as early as you can."
legal.terms.s5.title: "Your responsibilities"
legal.terms.s5.body: "Provide information that is accurate and yours: use your own email address, and describe your situation truthfully — the practice prepares for your visit based on what you submit. Do not use the site to harass, to probe or overload the systems, or to submit information about another person without their authority (a parent or legal guardian may act for their child)."
legal.terms.s6.title: "Your account and records"
legal.terms.s6.body: "The records area shows information the practice holds about you, after you verify your email. Keep access to your email secure — it is how the site knows you are you. If you believe someone else has used your email to access your records, contact the practice immediately."
legal.terms.s7.title: "Limits of liability"
legal.terms.s7.body: "We work to keep the site available and accurate, but it is provided \"as is\": we cannot promise it will be uninterrupted or error-free, and we are not liable for losses caused by events outside our reasonable control, or by use of the site contrary to these terms. Nothing in these terms limits any liability that cannot be limited under the law of Bangladesh, and nothing in them changes Dr Kyana's professional obligations for care she actually provides."
legal.terms.s8.title: "Changes and governing law"
legal.terms.s8.body: "We may update these terms; the version above tells you when they last changed. For material changes we will post a notice on the site, and where a change affects how your data is handled we will ask for your consent again, as described in the Privacy Notice. These terms are governed by the laws of Bangladesh, and any dispute belongs to the courts of Bangladesh."
legal.terms.s9.title: "Contact"
legal.terms.s9.body: "Questions about these terms: care@drkyana.com."

legal.privacy.title: "Privacy Notice"
legal.privacy.intro: "This notice explains what personal data drkyana.com collects, why, where it goes, how long it is kept, and the choices you have. It is provided under Bangladesh's data protection law. Health information is sensitive personal data — we treat everything you share here accordingly."
legal.privacy.s1.title: "Who is responsible"
legal.privacy.s1.body: "This site is operated by Dr Kyana's dental practice, Dhaka, Bangladesh — a dental surgeon registered with the Bangladesh Medical & Dental Council (BMDC Registration No. 15450), consulting at chambers across Dhaka. The practice is the controller responsible for your data. Contact: care@drkyana.com."
legal.privacy.s2.title: "What we collect, and why"
legal.privacy.s2.body: "We use your data only to: register and verify you, prepare your intake for the dentist, arrange and record your care, send practice email you have consented to, and keep the site secure. We do not use it for any other purpose without asking you first.\n\nWhat we collect:\n\n• Contact and identity details — your name, age, phone number, and email address.\n• Health information you share — symptoms, medical history, medications, allergies, and your conversation with the receptionist.\n• Care records — appointments and documents the practice prepares for you.\n• Technical data — limited information about your device or connection, used to prevent abuse and keep the service secure.\n\nWe do not use advertising trackers or analytics cookies. The only cookie is the one that keeps you signed in."
legal.privacy.s3.title: "The AI receptionist and where your data goes"
legal.privacy.s3.body: "When you use the receptionist, the information you share — such as your symptoms, age and medical history — is processed by Anthropic (Claude), an AI provider whose servers are outside Bangladesh, so the assistant can understand your request and prepare your intake. The AI drafts and organizes your intake; the licensed dentist reviews everything and makes all clinical decisions.\n\nWe also rely on third-party providers for hosting and email delivery, some of which operate outside Bangladesh. As a result your record, including health information, is stored outside Bangladesh. We transfer it on the basis of the consent you give at verification, under contracts that limit each provider to processing it only on our instructions. We do not sell your data, and we do not share it for advertising."
legal.privacy.s4.title: "Your consent"
legal.privacy.s4.body: "Before you use the receptionist you verify your email and give consent — separately for storing your care record, for AI processing of your messages, and for email from the practice. Each consent is recorded with the exact policy version and wording you agreed to, and the language in which it was shown to you. The English text is the authoritative version; Bengali and Persian translations are provided for convenience.\n\nYou can switch AI processing and practice email on or off at any time on the My Records page; changes take effect from your next message — the site checks your permissions every time before processing anything. To withdraw consent to storage of your care record, email care@drkyana.com (see the Support page); some records must by law be kept for a period even after you withdraw. Withdrawal does not affect processing that already happened while your consent was in force.\n\nThis service is intended for adults. For a child, a parent or guardian verifies their own email, completes the intake, and gives each consent on the child's behalf; we do not knowingly accept consent directly from a child."
legal.privacy.s5.title: "How long we keep data"
legal.privacy.s5.body: "Retention we enforce automatically:\n\n• Email verification codes — expire after 10 minutes and are deleted within 2 days.\n• Receptionist chat transcripts — cleared automatically after 90 days without activity.\n\nCare records (intakes, appointments, prescriptions) are kept for as long as professional and legal record-keeping standards require. Their deletion is not yet automated: the practice removes them on review or on an erasure request (see Your rights), subject to those retention rules."
legal.privacy.s6.title: "Your rights"
legal.privacy.s6.body: "You can: see your appointments and prescriptions on the My Records page; ask for a copy of your data; ask for a correction; withdraw consent; and ask for erasure of your record. For anything not available directly on the My Records page, email care@drkyana.com from your verified address — the Support page explains how requests are handled and how quickly we respond. If you are not satisfied with how we handle a request, you have the right to complain to the data protection authority established under Bangladesh's data protection law."
legal.privacy.s7.title: "Security"
legal.privacy.s7.body: "Access to patient data is restricted to the practice, and every access to a patient record is logged. We protect your information with appropriate technical and organizational safeguards. No system is perfectly secure; if a breach ever puts your data at risk, we will notify you and the data protection authority as the law requires."
legal.privacy.s8.title: "Changes to this notice"
legal.privacy.s8.body: "When this notice changes we update the version above. The version you consented to stays on record, so you can always tell what you agreed to. If a change materially affects how your data is used, we will ask for your consent again."

legal.support.title: "Support & Contact"
legal.support.intro: "How to reach a human, what to do in an emergency, and how data requests are handled."
legal.support.s1.title: "Emergencies"
legal.support.s1.body: "This site is not monitored in real time. For severe bleeding, swelling that affects breathing or swallowing, a serious injury, or any urgent medical problem, go to the nearest hospital emergency department or call the national emergency number 999 now. Do not wait for a reply from this site."
legal.support.s2.title: "Talk to a human"
legal.support.s2.body: "Email the practice at care@drkyana.com. We aim to reply within 2 business days. If you have an appointment and need to change it, include your name and the appointment date."
legal.support.s3.title: "Your records and permissions"
legal.support.s3.body: "The My Records page shows your appointments and prescriptions, and lets you switch AI processing and practice email on or off at any time; changes take effect from your next message or interaction with the site. To withdraw consent to storage of your care record, use a data request below — note that some records must by law be kept for a period even after you withdraw."
legal.support.s4.title: "Data requests: copy, correction, erasure"
legal.support.s4.body: "Email care@drkyana.com with the subject \"Data request\", from the email address you verified on this site — that is how we know the request is yours. Tell us what you want: a copy of your data, a correction, or erasure of your record. We respond within 30 days; if a request is unusually complex, we will tell you within that time how much longer we need and why.\n\nSome records must be kept for the period professional or legal rules require even after an erasure request; if that applies to yours, we will tell you what was kept and why."
legal.support.s5.title: "Problems with the AI receptionist"
legal.support.s5.body: "If the assistant misunderstood you, behaved unexpectedly, or said something that concerned you, email us a short description and roughly when it happened. The practice reviews every intake before acting on it, and reports like yours help us improve the assistant."

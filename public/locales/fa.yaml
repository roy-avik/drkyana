nav.receptionist: "پذیرشگر هوش مصنوعی"
receptionist.label: "هوش مصنوعی · روی دستگاه"
receptionist.title: "پذیرشگر هوش مصنوعی"
receptionist.subtitle: "درباره وقت ملاقات، ساعات کاری، خدمات یا هر چیز دیگری بپرسید — پیام شما روی دستگاه خودتان دسته‌بندی شده و در واتساپ به دکتر کیانا ارسال می‌شود."
receptionist.greeting: "سلام! من پذیرشگر هوش مصنوعی دکتر کیانا هستم. چه کمکی می‌توانم بکنم؟"
receptionist.placeholder: "بنویسید چه نیازی دارید…"
receptionist.loading: "هوش مصنوعی روی دستگاه در حال آماده‌سازی است — فقط یک بار اتفاق می‌افتد."
receptionist.thinking: "در حال فکر کردن…"
receptionist.privacy: "کاملاً روی دستگاه شما اجرا می‌شود. تا زمانی که روی ارسال نزنید، چیزی به دکتر کیانا ارسال نمی‌شود."
receptionist.intent.book_appointment.response: "خوشحال می‌شوم وقت ملاقات‌تان را تنظیم کنم. چند سوال کوتاه دارم."
receptionist.intent.reschedule.response: "البته. روی دکمه پایین بزنید تا درخواست تغییر را برای دکتر کیانا بفرستید — او زمان جدید را تایید می‌کند."
receptionist.intent.urgent.response: "این موضوع به‌نظر فوری می‌رسد. لطفاً همین حالا به دکتر کیانا پیام دهید — او در اولین فرصت پاسخ خواهد داد. اگر اورژانس دندانپزشکی است، به نزدیک‌ترین بیمارستان هم بروید."
receptionist.intent.ask_hours.response: "دکتر کیانا از شنبه تا پنج‌شنبه با وقت قبلی بیمار می‌بیند. جمعه‌ها تعطیل است. برای زمان خاص روی دکمه پایین بزنید."
receptionist.intent.ask_location.response: "دکتر کیانا در چندین مطب در سراسر داکا ویزیت می‌کند. محل دقیق ویزیت هنگام رزرو تایید می‌شود — بر اساس نزدیک‌ترین مکان به شما. روی دکمه پایین بزنید تا بپرسید کدام مطب مناسب‌تان است."
receptionist.intent.ask_services.response: "دکتر کیانا جرم‌گیری و تمیز کردن، درمان ریشه، ترمیم و مراقبت‌های پیشگیرانه را ارائه می‌دهد. برای پرسش درباره درمان خاص روی دکمه پایین بزنید."
receptionist.intent.ask_pricing.response: "هزینه به نوع درمان و مطب بستگی دارد. دکتر کیانا هنگام رزرو هزینه را تایید می‌کند. برای دریافت برآورد روی دکمه پایین بزنید."
receptionist.intent.ask_insurance.response: "پرداخت معمولاً در مطب انجام می‌شود. دکتر کیانا هنگام رزرو روش‌های قابل قبول را اطلاع می‌دهد. برای پرسش روی دکمه پایین بزنید."
receptionist.intent.greeting.response: "سلام! روی دکمه پایین بزنید تا در واتساپ به دکتر کیانا سلام کنید، یا بگویید چه نیازی دارید تا هدایت‌تان کنم."
receptionist.intent.other.response: "اجازه دهید پیام شما را در واتساپ به دکتر کیانا ارسال کنم — او مستقیماً پاسخ خواهد داد."

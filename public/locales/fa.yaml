nav.receptionist: "پذیرشگر هوش مصنوعی"
receptionist.label: "پذیرش هوش مصنوعی"
receptionist.title: "پذیرشگر هوش مصنوعی"
receptionist.subtitle: "درباره وقت ملاقات، ساعات کاری، خدمات یا هر چیز دیگری بپرسید — یک دستیار هوش مصنوعی به جمع‌آوری اطلاعات شما کمک می‌کند و آن‌ها را مستقیماً به تیم دکتر کیانا می‌رساند."
receptionist.greeting: "سلام! من پذیرشگر هوش مصنوعی دکتر کیانا هستم. چه کمکی می‌توانم بکنم؟"
receptionist.placeholder: "بنویسید چه نیازی دارید…"
receptionist.loading: "هوش مصنوعی روی دستگاه در حال آماده‌سازی است — فقط یک بار اتفاق می‌افتد."
receptionist.thinking: "در حال فکر کردن…"
receptionist.privacy: "پیام‌های شما توسط یک سرویس هوش مصنوعی (Claude شرکت Anthropic) پردازش شده و فقط با تیم دکتر کیانا به اشتراک گذاشته می‌شود."
receptionist.intent.book_appointment.response: "خوشحال می‌شوم وقت ملاقات‌تان را تنظیم کنم. چند سوال کوتاه دارم."
receptionist.intent.reschedule.response: "البته. درخواست تغییر خود را مستقیماً به دکتر کیانا بفرستید — او زمان جدید را تایید می‌کند."
receptionist.intent.urgent.response: "این موضوع به‌نظر فوری می‌رسد. لطفاً همین حالا به دکتر کیانا پیام دهید — او در اولین فرصت پاسخ خواهد داد. اگر اورژانس دندانپزشکی است، به نزدیک‌ترین بیمارستان هم بروید."
receptionist.intent.ask_hours.response: "دکتر کیانا از شنبه تا پنج‌شنبه با وقت قبلی بیمار می‌بیند. جمعه‌ها تعطیل است."
receptionist.intent.ask_location.response: "دکتر کیانا در چندین مطب در سراسر داکا ویزیت می‌کند. محل دقیق ویزیت هنگام رزرو تایید می‌شود — بر اساس نزدیک‌ترین مکان به شما."
receptionist.intent.ask_services.response: "دکتر کیانا جرم‌گیری و تمیز کردن، درمان ریشه، ترمیم و مراقبت‌های پیشگیرانه را ارائه می‌دهد."
receptionist.intent.ask_pricing.response: "هزینه به نوع درمان و مطب بستگی دارد. دکتر کیانا هنگام رزرو هزینه را تایید می‌کند."
receptionist.intent.ask_insurance.response: "پرداخت معمولاً در مطب انجام می‌شود. دکتر کیانا هنگام رزرو روش‌های قابل قبول را اطلاع می‌دهد."
receptionist.intent.greeting.response: "سلام! بگویید چه نیازی دارید تا به دکتر کیانا هدایت‌تان کنم."
receptionist.intent.other.response: "اجازه دهید پیام شما را به دکتر کیانا ارسال کنم — تیم او مستقیماً پاسخ خواهد داد."
receptionist.cta.send: "ارسال به دکتر کیانا"

intake.consent.message: "برای اینکه دکتر کیانا مراقبت مناسب را آماده کند، چند سوال از جمله درباره سلامت شما می‌پرسم. پیام‌های شما توسط یک سرویس هوش مصنوعی (Claude شرکت Anthropic) پردازش شده و فقط با تیم دکتر کیانا به اشتراک گذاشته می‌شود. برای موافقت ادامه را بزنید یا مستقیماً با دکتر کیانا پیام دهید."
intake.consent.accept: "متوجه شدم، ادامه دهیم"
intake.escape: "مستقیماً به دکتر کیانا پیام دهید"
intake.skip: "(رد شد)"
intake.skip_button: "رد کردن"
intake.review.message: "این چیزی است که برای دکتر کیانا می‌فرستم:"
intake.triage.red_message: "این ممکن است نیاز به توجه فوری داشته باشد. اطلاعات شما را سریع به دکتر کیانا می‌رسانم. اگر وضعیت شدید است، لطفاً به نزدیک‌ترین بیمارستان هم مراجعه کنید."
intake.group.identity.intro: "مشخصات شما را یادداشت کنم تا دکتر کیانا بتواند با شما تماس بگیرد."
intake.group.complaint.intro: "کمی درباره مشکل‌تان بگویید."
intake.group.medical.intro: "چند سوال سلامتی — اینها به دکتر کیانا کمک می‌کند درمان ایمن‌تری برنامه‌ریزی کند."
intake.group.dental_history.intro: "تقریباً تمام شد — فقط سابقه دندانپزشکی شما."
intake.group.logistics.intro: "زمان و مکان مناسب را پیدا کنیم."

legal.terms.title: "شرایط استفاده از خدمات"
legal.terms.intro: "این شرایط بر استفاده شما از drkyana.com — وب‌سایت، پذیرشگر هوش مصنوعی و بخش سوابق بیمار — حاکم است. با استفاده از سایت، آن‌ها را می‌پذیرید. خودِ درمان دندانپزشکی را دکتر کیانا حضوری ارائه می‌دهد و تابع استانداردهای حرفه‌ای و قوانین مربوط است، نه این سند."
legal.terms.s1.title: "این خدمت چیست"
legal.terms.s1.body: "این سایت به شما کمک می‌کند با مطب دندانپزشکی دکتر کیانا در تماس باشید: می‌توانید مشکل دندانی خود را شرح دهید، فرم پذیرش را کامل کنید، درخواست نوبت بدهید و نوبت‌ها و نسخه‌های خود را ببینید. سایت اطلاعات را برای مطب سامان می‌دهد — خودش ارائه‌دهنده خدمات درمانی نیست، و استفاده از آن تا زمانی که مطب مراقبت را تأیید نکند، رابطه پزشک–بیمار ایجاد نمی‌کند."
legal.terms.s2.title: "برای موارد اورژانسی نیست"
legal.terms.s2.body: "سایت و پذیرشگر هوش مصنوعی آن به‌صورت لحظه‌ای پایش نمی‌شوند و نباید در وضعیت اورژانسی استفاده شوند. در صورت خونریزی شدید، تورم صورت که تنفس یا بلع را دشوار می‌کند، آسیب جدی یا هر مشکل فوری دیگر، بلافاصله به اورژانس نزدیک‌ترین بیمارستان بروید یا با شماره اورژانس ملی ۹۹۹ تماس بگیرید."
legal.terms.s3.title: "پذیرشگر هوش مصنوعی"
legal.terms.s3.body: "پذیرشگر یک دستیار هوش مصنوعی است. اطلاعاتی را که خودتان می‌خواهید جمع می‌کند، پرسش‌های معمول پذیرش را می‌پرسد و اطلاعات عمومی هماهنگی (مانند محله مطب‌ها و روزهای حضور) می‌دهد. تشخیص نمی‌دهد، نسخه نمی‌نویسد و هیچ تصمیم بالینی نمی‌گیرد. هر امر بالینی — توصیه، نسخه، درمان — تنها پس از بررسی پرونده شما از سوی دکتر کیانا انجام می‌شود.\n\nاطلاعات دستیار توصیه پزشکی نیست، و دستیار ممکن است اشتباه بفهمد یا خطا کند؛ مطب هر پذیرش را پیش از اقدام بررسی می‌کند. وقتی دستیار فوریت را برآورد می‌کند، این تنها ابزاری برای اولویت‌بندی پاسخ مطب است — ارزیابی سلامت شما نیست، و هرگز نباید به‌خاطر آن مراجعه به درمان را عقب بیندازید."
legal.terms.s4.title: "نوبت‌ها"
legal.terms.s4.body: "درخواست‌های نوبت از طریق سایت تا زمانی که مطب تأیید نکند، صرفاً پیشنهاد است. مکان‌ها بسته به مطب متفاوت است و برای هر رزرو جداگانه تأیید می‌شود. اگر نمی‌توانید بیایید، لطفاً هر چه زودتر به مطب خبر دهید."
legal.terms.s5.title: "مسئولیت‌های شما"
legal.terms.s5.body: "اطلاعات درست و متعلق به خودتان بدهید: از ایمیل خودتان استفاده کنید و وضعیت‌تان را صادقانه شرح دهید — مطب بر اساس آنچه ثبت می‌کنید برای ویزیت شما آماده می‌شود. از سایت برای آزار، نفوذ یا فشار بر سیستم‌ها، یا ثبت اطلاعات دیگران بدون اجازه آن‌ها استفاده نکنید (پدر و مادر یا سرپرست قانونی می‌توانند از طرف فرزندشان اقدام کنند)."
legal.terms.s6.title: "حساب و سوابق شما"
legal.terms.s6.body: "پس از تأیید ایمیل، بخش سوابق اطلاعاتی را نشان می‌دهد که مطب درباره شما نگه می‌دارد. دسترسی به ایمیل‌تان را امن نگه دارید — سایت از همین راه شما را می‌شناسد. اگر گمان می‌کنید کس دیگری با ایمیل شما وارد سوابق شده، فوراً با مطب تماس بگیرید."
legal.terms.s7.title: "حدود مسئولیت"
legal.terms.s7.body: "ما برای در دسترس و دقیق نگه داشتن سایت تلاش می‌کنیم، اما سایت «همان‌گونه که هست» ارائه می‌شود: نمی‌توانیم بی‌وقفه یا بی‌خطا بودن آن را تضمین کنیم، و در قبال زیان‌های ناشی از رویدادهای خارج از کنترل معقول ما یا استفاده مغایر با این شرایط مسئول نیستیم. هیچ‌چیز در این شرایط مسئولیتی را که طبق قوانین بنگلادش قابل محدودسازی نیست محدود نمی‌کند، و تعهدات حرفه‌ای دکتر کیانا درباره مراقبتی که عملاً ارائه می‌دهد را نیز تغییر نمی‌دهد."
legal.terms.s8.title: "تغییرات و قانون حاکم"
legal.terms.s8.body: "ممکن است این شرایط را به‌روزرسانی کنیم؛ نسخه بالای صفحه نشان می‌دهد آخرین تغییر چه زمانی بوده است. برای تغییرات مهم در سایت اطلاعیه می‌گذاریم، و اگر تغییری بر نحوه استفاده از داده‌های شما اثر بگذارد، مطابق سیاست حریم خصوصی دوباره رضایت شما را می‌خواهیم. این شرایط تابع قوانین بنگلادش است و هر اختلافی در صلاحیت دادگاه‌های بنگلادش است."
legal.terms.s9.title: "تماس"
legal.terms.s9.body: "پرسش درباره این شرایط: care@drkyana.com."

legal.privacy.title: "سیاست حریم خصوصی"
legal.privacy.intro: "این سیاست توضیح می‌دهد drkyana.com چه داده‌های شخصی‌ای را جمع می‌کند، چرا، به کجا می‌رود، چه مدت نگه داشته می‌شود و چه انتخاب‌هایی دارید. این سیاست ذیل قانون حفاظت از داده‌های بنگلادش ارائه می‌شود. اطلاعات سلامت، داده شخصی حساس است — با هر آنچه اینجا در میان می‌گذارید همان‌گونه رفتار می‌کنیم."
legal.privacy.s1.title: "چه کسی مسئول است"
legal.privacy.s1.body: "این سایت را مطب دندانپزشکی دکتر کیانا در داکا، بنگلادش اداره می‌کند — جراح دندانپزشک دارای ثبت در شورای پزشکی و دندانپزشکی بنگلادش (شماره ثبت BMDC: 15450)، که در مطب‌های مختلف داکا ویزیت می‌کند. مسئول (کنترلر) داده‌های شما همین مطب است. تماس: care@drkyana.com."
legal.privacy.s2.title: "چه چیزهایی را جمع می‌کنیم و چرا"
legal.privacy.s2.body: "داده‌های شما را فقط برای این موارد به کار می‌بریم: ثبت‌نام و تأیید شما، آماده‌سازی پذیرش برای دندانپزشک، هماهنگی و ثبت مراقبت شما، ارسال ایمیل مطب که به آن رضایت داده‌اید، و امن نگه داشتن سایت. بدون پرسش قبلی از شما، برای هیچ هدف دیگری استفاده نمی‌کنیم.\n\nآنچه جمع می‌کنیم:\n\n• اطلاعات تماس و هویت — نام، سن، شماره تلفن و ایمیل.\n• اطلاعات سلامتی که خودتان می‌دهید — علائم، سابقه پزشکی، داروها، حساسیت‌ها و گفت‌وگوی شما با پذیرشگر.\n• سوابق مراقبت — نوبت‌ها و مدارکی که مطب برای شما تهیه می‌کند.\n• داده فنی — اطلاعات محدودی درباره دستگاه یا اتصال شما، برای جلوگیری از سوءاستفاده و امن نگه داشتن سرویس.\n\nاز ردیاب تبلیغاتی یا کوکی تحلیلی استفاده نمی‌کنیم. تنها کوکی موجود، کوکی ورود شماست."
legal.privacy.s3.title: "پذیرشگر هوش مصنوعی و مسیر داده‌های شما"
legal.privacy.s3.body: "هنگام استفاده از پذیرشگر، اطلاعاتی که به اشتراک می‌گذارید — مانند علائم، سن و سابقه پزشکی شما — توسط Anthropic (Claude) پردازش می‌شود، یک ارائه‌دهنده هوش مصنوعی که سرورهایش خارج از بنگلادش است، تا دستیار درخواست شما را بفهمد و پذیرش‌تان را آماده کند. هوش مصنوعی پذیرش شما را پیش‌نویس و سامان می‌دهد؛ دندانپزشک دارای مجوز همه‌چیز را بازبینی می‌کند و همه تصمیم‌های بالینی را می‌گیرد.\n\nبرای میزبانی و ارسال ایمیل نیز به ارائه‌دهندگان ثالث تکیه می‌کنیم که برخی خارج از بنگلادش فعالیت می‌کنند. در نتیجه پرونده شما، از جمله اطلاعات سلامت، خارج از بنگلادش نگهداری می‌شود. انتقال بر پایه رضایتی است که هنگام تأیید می‌دهید و طبق قراردادهایی که هر ارائه‌دهنده را تنها به پردازش بر اساس دستور ما محدود می‌کند. داده شما را نمی‌فروشیم و برای تبلیغات با کسی به اشتراک نمی‌گذاریم."
legal.privacy.s4.title: "رضایت شما"
legal.privacy.s4.body: "پیش از استفاده از پذیرشگر، ایمیل خود را تأیید و رضایت می‌دهید — جداگانه برای نگهداری پرونده الکترونیک سلامت، پردازش هوش مصنوعیِ پیام‌ها، و ایمیل مطب. هر رضایت با نسخه و متن دقیقی که با آن موافقت کرده‌اید و زبانی که به شما نمایش داده شده ثبت می‌شود. متن انگلیسی معتبر است؛ ترجمه‌های بنگالی و فارسی برای سهولت‌اند.\n\nدر صفحه «سوابق من» می‌توانید هر زمان پردازش هوش مصنوعی و ایمیل مطب را روشن یا خاموش کنید؛ تغییرها از پیام بعدی شما اثر می‌کند — سایت پیش از هر پردازش، هر بار مجوزهای شما را بررسی می‌کند. برای پس گرفتن رضایتِ نگهداری پرونده الکترونیک سلامت به care@drkyana.com ایمیل بزنید (صفحه پشتیبانی را ببینید)؛ برخی سوابق حتی پس از پس گرفتن رضایت باید قانوناً تا مدتی نگه داشته شوند. پس گرفتن رضایت بر پردازشی که در زمان اعتبار رضایت انجام شده اثری ندارد.\n\nاین خدمت برای بزرگسالان است. برای کودک، پدر و مادر یا سرپرست ایمیل خودش را تأیید می‌کند، پذیرش را کامل می‌کند و هر رضایت را از طرف کودک می‌دهد؛ ما آگاهانه رضایت مستقیم از کودک نمی‌پذیریم."
legal.privacy.s5.title: "داده‌ها را چه مدت نگه می‌داریم"
legal.privacy.s5.body: "نگهداری‌ای که به‌صورت خودکار اعمال می‌کنیم:\n\n• کدهای تأیید ایمیل — پس از ۱۰ دقیقه منقضی و ظرف ۲ روز حذف می‌شوند.\n• متن گفت‌وگو با پذیرشگر — پس از ۹۰ روز بدون فعالیت به‌طور خودکار پاک می‌شود.\n\nسوابق مراقبت (پذیرش‌ها، نوبت‌ها، نسخه‌ها) تا زمانی که استانداردهای حرفه‌ای و قانونی نگهداری سوابق اقتضا کند نگه داشته می‌شوند. حذف آن‌ها هنوز خودکار نیست: مطب در بازبینی یا با درخواست حذف (بخش حقوق شما) و با رعایت همان قواعد نگهداری، آن‌ها را برمی‌دارد."
legal.privacy.s6.title: "حقوق شما"
legal.privacy.s6.body: "می‌توانید: نوبت‌ها و نسخه‌های خود را در صفحه «سوابق من» ببینید؛ نسخه‌ای از داده‌های خود را بخواهید؛ اصلاح بخواهید؛ رضایت را پس بگیرید؛ و درخواست حذف پرونده بدهید. برای هر چیزی که مستقیماً در صفحه «سوابق من» نیست، از نشانی تأییدشده خود به care@drkyana.com ایمیل بزنید — صفحه پشتیبانی توضیح می‌دهد درخواست‌ها چگونه و با چه سرعتی رسیدگی می‌شوند. اگر از رسیدگی به درخواستی راضی نبودید، حق دارید به مرجع حفاظت از داده‌ها که ذیل قانون حفاظت از داده‌های بنگلادش تشکیل شده شکایت کنید."
legal.privacy.s7.title: "امنیت"
legal.privacy.s7.body: "دسترسی به داده بیماران به مطب محدود است و هر دسترسی به پرونده بیمار ثبت می‌شود. اطلاعات شما را با تدابیر فنی و سازمانی مناسب محافظت می‌کنیم. هیچ سیستمی کاملاً امن نیست؛ اگر نقضی داده شما را در معرض خطر قرار دهد، مطابق قانون به شما و مرجع حفاظت از داده‌ها اطلاع می‌دهیم."
legal.privacy.s8.title: "تغییرات این سیاست"
legal.privacy.s8.body: "هرگاه این سیاست تغییر کند، نسخه بالای صفحه را به‌روزرسانی می‌کنیم. نسخه‌ای که به آن رضایت داده‌اید در سوابق می‌ماند، پس همیشه می‌دانید با چه چیزی موافقت کرده‌اید. اگر تغییری به‌طور اساسی بر نحوه استفاده از داده شما اثر بگذارد، دوباره رضایت شما را می‌خواهیم."

legal.support.title: "پشتیبانی و تماس"
legal.support.intro: "چگونه با یک انسان تماس بگیرید، در وضعیت اورژانسی چه کنید، و درخواست‌های داده چگونه رسیدگی می‌شود."
legal.support.s1.title: "موارد اورژانسی"
legal.support.s1.body: "این سایت به‌صورت لحظه‌ای پایش نمی‌شود. در صورت خونریزی شدید، تورمی که تنفس یا بلع را دشوار می‌کند، آسیب جدی یا هر مشکل فوری، همین حالا به اورژانس نزدیک‌ترین بیمارستان بروید یا با شماره اورژانس ملی ۹۹۹ تماس بگیرید. منتظر پاسخ این سایت نمانید."
legal.support.s2.title: "گفت‌وگو با یک انسان"
legal.support.s2.body: "به مطب ایمیل بزنید: care@drkyana.com. معمولاً ظرف ۲ روز کاری پاسخ می‌دهیم. اگر نوبتی دارید و می‌خواهید تغییرش دهید، نام و تاریخ نوبت را بنویسید."
legal.support.s3.title: "سوابق و مجوزهای شما"
legal.support.s3.body: "صفحه «سوابق من» نوبت‌ها و نسخه‌های شما را نشان می‌دهد و می‌توانید پردازش هوش مصنوعی و ایمیل مطب را هر زمان روشن یا خاموش کنید؛ تغییرها از پیام یا تعامل بعدی شما با سایت اثر می‌کند. برای پس گرفتن رضایتِ نگهداری پرونده الکترونیک سلامت، از «درخواست داده» در پایین استفاده کنید — توجه کنید برخی سوابق حتی پس از پس گرفتن رضایت باید قانوناً تا مدتی نگه داشته شوند."
legal.support.s4.title: "درخواست داده: نسخه، اصلاح، حذف"
legal.support.s4.body: "از ایمیلی که در این سایت تأیید کرده‌اید، با موضوع \"Data request\" به care@drkyana.com ایمیل بزنید — از همین راه می‌فهمیم درخواست از خود شماست. بگویید چه می‌خواهید: نسخه‌ای از داده‌ها، اصلاح، یا حذف پرونده. ظرف ۳۰ روز پاسخ می‌دهیم؛ اگر درخواست به‌طور غیرمعمول پیچیده باشد، در همان مهلت می‌گوییم چقدر زمان بیشتری لازم است و چرا.\n\nبرخی سوابق حتی پس از درخواست حذف باید تا مدتی که قواعد حرفه‌ای یا قانونی اقتضا می‌کند نگه داشته شوند؛ اگر درباره شما چنین شود، می‌گوییم چه چیزی و چرا نگه داشته شد."
legal.support.s5.title: "مشکل با پذیرشگر هوش مصنوعی"
legal.support.s5.body: "اگر دستیار حرف شما را بد فهمید، رفتاری غیرمنتظره داشت یا چیزی نگران‌کننده گفت، شرح کوتاهی به‌همراه زمان تقریبی برای ما ایمیل کنید. مطب هر پذیرش را پیش از اقدام بررسی می‌کند و گزارش‌هایی مثل گزارش شما به بهتر شدن دستیار کمک می‌کند."

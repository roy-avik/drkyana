receptionist.subtitle: "درباره وقت ملاقات، ساعات کاری، خدمات یا هر چیز دیگری بپرسید — یک دستیار هوش مصنوعی به جمع‌آوری اطلاعات شما کمک می‌کند و آن‌ها را مستقیماً به تیم دکتر کیانا می‌رساند."
receptionist.greeting: "سلام! من پذیرشگر هوش مصنوعی دکتر کیانا هستم. چه کمکی می‌توانم بکنم؟"

about.label: "رویکرد"
about.title: "درباره"
about.p1: "دندانپزشکی را همان‌گونه انجام می‌دهم که برای خودم می‌خواهم — بدون عجله، دقیق و با تمرکز بر فردی که روی صندلی نشسته است. کار بالینی من شامل جرم‌گیری و درمان لثه، درمان ریشه دندان، ترمیم و مراقبت‌های پیشگیرانه است."
about.p2: "دندانپزشکی خوب در تلاقی علم و اعتماد قرار دارد. زمان می‌گذارم تا هر مرحله را توضیح دهم، به نگرانی‌های واقعی شما گوش دهم و درمان را متناسب با شرایطتان تنظیم کنم — زیرا شفافیت و آرامش به اندازه‌ی خود درمان اهمیت دارد."

services.label: "مراقبت"
services.title: "خدمات"
services.intro: "دندانپزشکی مبتنی بر شواهد، تکنیک مدرن و دستی مطمئن — در محبوب‌ترین خدمات مورد درخواست بیماران."
services.scaling.title: "جرم‌گیری و تمیز کردن"
services.scaling.desc: "تمیز کردن حرفه‌ای و کامل برای از بین بردن پلاک و جرم، آرام کردن لثه‌های ملتهب و پیشگیری از بیماری‌های پریودنتال."
services.rct.title: "درمان ریشه دندان"
services.rct.desc: "درمان اندودانتیک برای دندان‌های عفونی یا آسیب‌دیده — با دقت، آرامش و با هدف حفظ دندان طبیعی."
services.general.title: "دندانپزشکی عمومی"
services.general.desc: "معاینات، پر کردن، ترمیم و مراقبت‌های پیشگیرانه روزمره — کارهای روزانه‌ای که دهانی سالم را سالم نگه می‌دارد."


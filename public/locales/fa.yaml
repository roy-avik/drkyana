meta.title: "دکتر کیانا · جراح دندانپزشک · داکا"
meta.description: "دکتر کیانا — جراح دندانپزشک، ویزیت در چندین مطب در سراسر داکا. دندانپزشکی مدرن، مراقبتی اندیشمندانه: جرم‌گیری، درمان ریشه، ترمیم و مراقبت‌های پیشگیرانه."

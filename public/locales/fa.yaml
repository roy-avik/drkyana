receptionist.done.body: "تیم دکتر کیانا برای تأیید با شما تماس می‌گیرد. هر زمان می‌توانید آن را در سوابق خود ببینید."
receptionist.done.records: "مشاهده سوابق من"
receptionist.done.again: "پرسش دیگری دارم"
receptionist.privacy: "پیام‌های شما توسط یک سرویس هوش مصنوعی (Claude شرکت Anthropic) پردازش شده و فقط با تیم دکتر کیانا به اشتراک گذاشته می‌شود."

intake.consent.message: "برای اینکه دکتر کیانا مراقبت مناسب را آماده کند، چند سوال از جمله درباره سلامت شما می‌پرسم."
intake.consent.health: "پیام‌های شما — از جمله اطلاعات سلامتی که به اشتراک می‌گذارید — توسط ارائه‌دهنده هوش مصنوعی ما (Claude شرکت Anthropic) برای رسیدگی به درخواست شما پردازش می‌شود و فقط با تیم دکتر کیانا به اشتراک گذاشته می‌شود. با ادامه دادن، شما با این موضوع موافقت می‌کنید. در غیر این صورت می‌توانید مستقیماً به دکتر کیانا پیام دهید."

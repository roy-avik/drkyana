nav.receptionist: "AI রিসেপশনিস্ট"
receptionist.label: "AI · ডিভাইসেই"
receptionist.title: "AI রিসেপশনিস্ট"
receptionist.subtitle: "অ্যাপয়েন্টমেন্ট, সময়সূচী, সেবা বা অন্য কিছু সম্পর্কে জিজ্ঞাসা করুন — আপনার বার্তা আপনার ডিভাইসেই শ্রেণীবদ্ধ হয় এবং হোয়াটসঅ্যাপে ডা. কিয়ানার কাছে পাঠানো হয়।"
receptionist.greeting: "নমস্কার! আমি ডা. কিয়ানার AI রিসেপশনিস্ট। আজ আপনাকে কীভাবে সাহায্য করতে পারি?"
receptionist.placeholder: "আপনার যা প্রয়োজন তা লিখুন…"
receptionist.loading: "ডিভাইসে AI প্রস্তুত হচ্ছে — এটি একবারই হয়।"
receptionist.thinking: "ভাবছি…"
receptionist.privacy: "সবকিছু আপনার ডিভাইসেই চলে। 'পাঠান'-এ ট্যাপ না করা পর্যন্ত কিছুই ডা. কিয়ানার কাছে পাঠানো হয় না।"
receptionist.intent.book_appointment.response: "অ্যাপয়েন্টমেন্ট নিতে সাহায্য করতে পেরে খুশি। কয়েকটি ছোট প্রশ্ন আছে।"
receptionist.intent.reschedule.response: "অবশ্যই। নিচের বোতামে ট্যাপ করে সরাসরি ডা. কিয়ানাকে আপনার পরিবর্তনের অনুরোধ পাঠান — তিনি নতুন সময় নিশ্চিত করবেন।"
receptionist.intent.urgent.response: "এটি জরুরি মনে হচ্ছে। অনুগ্রহ করে এখনই ডা. কিয়ানাকে মেসেজ করুন — তিনি যত দ্রুত সম্ভব উত্তর দেবেন। যদি এটি ডেন্টাল ইমার্জেন্সি হয়, কাছাকাছি হাসপাতালেও যাওয়ার কথা বিবেচনা করুন।"
receptionist.intent.ask_hours.response: "ডা. কিয়ানা শনিবার থেকে বৃহস্পতিবার, অ্যাপয়েন্টমেন্ট অনুসারে রোগী দেখেন। শুক্রবার বন্ধ। নির্দিষ্ট সময়ের জন্য নিচের বোতামে ট্যাপ করুন।"
receptionist.intent.ask_location.response: "ডা. কিয়ানা ঢাকার বিভিন্ন চেম্বারে পরামর্শ দেন। আপনার ভিজিটের জন্য সঠিক স্থান বুকিংয়ের সময় নিশ্চিত করা হয় — আপনার জন্য সবচেয়ে সুবিধাজনক জায়গার ভিত্তিতে। কোন চেম্বার আপনার জন্য উপযুক্ত তা জিজ্ঞাসা করতে নিচের বোতামে ট্যাপ করুন।"
receptionist.intent.ask_services.response: "ডা. কিয়ানা স্কেলিং ও ক্লিনিং, রুট ক্যানেল চিকিৎসা, রেস্টোরেশন এবং নিয়মিত প্রতিরোধমূলক যত্ন প্রদান করেন। নির্দিষ্ট চিকিৎসা সম্পর্কে জিজ্ঞাসা করতে নিচের বোতামে ট্যাপ করুন।"
receptionist.intent.ask_pricing.response: "মূল্য নির্দিষ্ট চিকিৎসা এবং চেম্বারের উপর নির্ভর করে। ডা. কিয়ানা বুকিংয়ের সময় খরচ নিশ্চিত করবেন। অনুমান জানতে নিচের বোতামে ট্যাপ করুন।"
receptionist.intent.ask_insurance.response: "পেমেন্ট সাধারণত চেম্বারে করা হয়। ডা. কিয়ানা বুকিংয়ের সময় কী গ্রহণযোগ্য তা জানাবেন। জিজ্ঞাসা করতে নিচের বোতামে ট্যাপ করুন।"
receptionist.intent.greeting.response: "নমস্কার! হোয়াটসঅ্যাপে ডা. কিয়ানাকে শুভেচ্ছা জানাতে নিচের বোতামে ট্যাপ করুন, অথবা আপনার যা প্রয়োজন তা বলুন আমি পথ দেখাবো।"
receptionist.intent.other.response: "আমি আপনার বার্তাটি হোয়াটসঅ্যাপে ডা. কিয়ানার কাছে পাঠাচ্ছি — তিনি সরাসরি উত্তর দেবেন।"
receptionist.cta.send: "হোয়াটসঅ্যাপে ডা. কিয়ানাকে পাঠান"
receptionist.cta.urgent: "এখনই হোয়াটসঅ্যাপে ডা. কিয়ানাকে মেসেজ করুন"

intake.consent.message: "শুরুর আগে, ডা. কিয়ানা যাতে সঠিক যত্ন প্রস্তুত করতে পারেন তার জন্য কিছু স্বাস্থ্য সংক্রান্ত প্রশ্ন করব। আপনার উত্তর শুধুমাত্র ডা. কিয়ানার সাথে শেয়ার করা হবে এবং নিরাপদে সংরক্ষিত থাকবে। 'পাঠান'-এ ট্যাপ না করা পর্যন্ত কিছুই পাঠানো হবে না।"
intake.consent.accept: "বুঝেছি, চলুন শুরু করি"
intake.escape: "সরাসরি ডা. কিয়ানাকে মেসেজ করুন"

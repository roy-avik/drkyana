receptionist.label: "AI রিসেপশনিস্ট"
receptionist.title: "AI রিসেপশনিস্ট"
receptionist.subtitle: "অ্যাপয়েন্টমেন্ট, সময়সূচী, সেবা বা অন্য কিছু সম্পর্কে জিজ্ঞাসা করুন — একটি AI সহকারী আপনার তথ্য সংগ্রহে সাহায্য করে এবং সরাসরি ডা. কিয়ানার টিমের কাছে পৌঁছে দেয়।"
receptionist.greeting: "নমস্কার! আমি ডা. কিয়ানার AI রিসেপশনিস্ট। আজ আপনাকে কীভাবে সাহায্য করতে পারি?"
receptionist.placeholder: "আপনার যা প্রয়োজন তা লিখুন…"
receptionist.form_pending: "এগিয়ে যেতে উপরের ধাপটি সম্পূর্ণ করুন"
receptionist.thinking: "ভাবছি…"

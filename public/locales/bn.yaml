about.label: "দৃষ্টিভঙ্গি"
about.title: "পরিচিতি"
about.p1: "আমি দন্তচিকিৎসা সেভাবেই করি, যেভাবে নিজের জন্য চাইব — তাড়াহুড়োবিহীন, নিখুঁত এবং চেয়ারে বসা মানুষটিকে কেন্দ্র করে। আমার ক্লিনিক্যাল কাজে স্কেলিং ও রুট প্ল্যানিং, রুট ক্যানেল চিকিৎসা, রেস্টোরেশন এবং নিয়মিত প্রতিরোধমূলক যত্ন অন্তর্ভুক্ত।"
about.p2: "ভালো দন্তচিকিৎসা বিজ্ঞান ও বিশ্বাসের সংযোগস্থলে দাঁড়িয়ে। আমি প্রতিটি ধাপ ব্যাখ্যা করতে, আপনার সত্যিকারের উদ্বেগ শুনতে এবং সেই অনুযায়ী চিকিৎসা সাজাতে সময় নিই — কারণ স্বচ্ছতা ও স্বস্তি কাজের মতোই গুরুত্বপূর্ণ।"

services.label: "পরিচর্যা"
services.title: "সেবাসমূহ"
services.intro: "প্রমাণভিত্তিক দন্তচিকিৎসা, আধুনিক কৌশল এবং স্থির হাত — রোগীরা সবচেয়ে বেশি যেসব সেবা চান, সেগুলোতে।"
services.scaling.title: "স্কেলিং ও ক্লিনিং"
services.scaling.desc: "প্লাক ও টার্টার দূর করতে, প্রদাহজনিত মাড়িকে আরাম দিতে এবং পেরিওডন্টাল রোগ প্রতিরোধে পেশাদার পূর্ণাঙ্গ পরিষ্কারকরণ।"
services.rct.title: "রুট ক্যানেল চিকিৎসা"
services.rct.desc: "সংক্রমিত বা ক্ষতিগ্রস্ত দাঁতের জন্য এন্ডোডন্টিক চিকিৎসা — সতর্ক, শান্ত, এবং প্রাকৃতিক দাঁত রক্ষার লক্ষ্যে।"
services.general.title: "সাধারণ দন্তচিকিৎসা"
services.general.desc: "পরীক্ষা, ফিলিং, রেস্টোরেশন এবং নিয়মিত প্রতিরোধমূলক যত্ন — সুস্থ মুখকে সুস্থ রাখার দৈনন্দিন কাজ।"


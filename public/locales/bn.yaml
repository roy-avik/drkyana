intake.consent.message: "ডা. কিয়ানা যাতে সঠিক যত্ন প্রস্তুত করতে পারেন তার জন্য আমি স্বাস্থ্য সহ কয়েকটি প্রশ্ন করব।"
intake.consent.health: "আপনার বার্তা — আপনি যে স্বাস্থ্য তথ্য শেয়ার করেন তা সহ — আপনার অনুরোধ প্রক্রিয়া করতে আমাদের AI প্রদানকারী (Anthropic-এর Claude) দ্বারা প্রসেস করা হয় এবং শুধুমাত্র ডা. কিয়ানার টিমের সাথে শেয়ার করা হয়। চালিয়ে গেলে আপনি এতে সম্মত হচ্ছেন। অন্যথায় আপনি সরাসরি ডা. কিয়ানাকে মেসেজ করতে পারেন।"
intake.consent.accept: "আমি সম্মত, চালিয়ে যান"
intake.escape: "পরিবর্তে চেম্বারে ইমেল করুন"

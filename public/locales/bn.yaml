intake.triage.red_message: "এটির জরুরি মনোযোগ প্রয়োজন হতে পারে। আমি আপনার তথ্য দ্রুত ডা. কিয়ানার কাছে পাঠাচ্ছি। পরিস্থিতি গুরুতর হলে অনুগ্রহ করে নিকটস্থ হাসপাতালে যাওয়ার কথাও ভাবুন।"
intake.group.identity.intro: "আপনার কিছু তথ্য নিই যাতে ডা. কিয়ানা আপনার সাথে যোগাযোগ করতে পারেন।"
intake.group.complaint.intro: "আপনার সমস্যা সম্পর্কে একটু বলুন।"
intake.group.medical.intro: "কিছু স্বাস্থ্য সংক্রান্ত প্রশ্ন — এগুলো ডা. কিয়ানাকে নিরাপদ চিকিৎসা পরিকল্পনা করতে সাহায্য করে।"

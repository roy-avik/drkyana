legal.terms.title: "সেবার শর্তাবলি"
legal.terms.intro: "এই শর্তাবলি drkyana.com — ওয়েবসাইট, AI রিসেপশনিস্ট ও রোগীর রেকর্ড অংশ — ব্যবহারের ক্ষেত্রে প্রযোজ্য। সাইট ব্যবহার করলে আপনি এগুলো মেনে নিচ্ছেন। দন্তচিকিৎসা নিজে ডা. কিয়ানা সরাসরি সাক্ষাতে প্রদান করেন এবং তা পেশাগত মান ও প্রযোজ্য আইনের অধীন — এই দলিলের নয়।"
legal.terms.s1.title: "এই সেবাটি কী"
legal.terms.s1.body: "এই সাইট আপনাকে ডা. কিয়ানার ডেন্টাল প্র্যাকটিসের সঙ্গে যোগাযোগে সাহায্য করে: আপনি দাঁতের সমস্যা বর্ণনা করতে, ইনটেক ফর্ম পূরণ করতে, অ্যাপয়েন্টমেন্টের অনুরোধ করতে এবং নিজের অ্যাপয়েন্টমেন্ট ও প্রেসক্রিপশন দেখতে পারেন। সাইটটি প্র্যাকটিসের জন্য তথ্য গুছিয়ে দেয় — এটি নিজে কোনো চিকিৎসা প্রদানকারী নয়, এবং প্র্যাকটিস সেবা নিশ্চিত না করা পর্যন্ত এটি ব্যবহারে ডাক্তার–রোগী সম্পর্ক তৈরি হয় না।"
legal.terms.s2.title: "জরুরি অবস্থার জন্য নয়"
legal.terms.s2.body: "সাইট ও এর AI রিসেপশনিস্ট সার্বক্ষণিক নজরদারিতে থাকে না, তাই জরুরি অবস্থায় এটি ব্যবহার করা যাবে না। তীব্র রক্তক্ষরণ, শ্বাস বা গিলতে সমস্যা সৃষ্টিকারী মুখের ফোলা, গুরুতর আঘাত বা অন্য যেকোনো জরুরি স্বাস্থ্য সমস্যায় এখনই নিকটস্থ হাসপাতালের জরুরি বিভাগে যান অথবা জাতীয় জরুরি নম্বর ৯৯৯-এ কল করুন।"
legal.terms.s3.title: "AI রিসেপশনিস্ট"
legal.terms.s3.body: "রিসেপশনিস্ট একটি AI সহায়ক। আপনি যা জানাতে চান তা সংগ্রহ করে, রুটিন ইনটেক প্রশ্ন করে এবং সাধারণ ব্যবস্থাপনাগত তথ্য (যেমন চেম্বারের এলাকা ও বসার দিন) জানায়। এটি রোগনির্ণয় করে না, প্রেসক্রিপশন দেয় না, কোনো ক্লিনিক্যাল সিদ্ধান্তও নেয় না। ক্লিনিক্যাল যা কিছু — পরামর্শ, প্রেসক্রিপশন, চিকিৎসা — তা কেবল ডা. কিয়ানা আপনার কেস পর্যালোচনার পর দেন।\n\nসহায়কের দেওয়া তথ্য চিকিৎসা-পরামর্শ নয়, এবং সহায়ক ভুল বুঝতে বা ভুল করতে পারে; প্র্যাকটিস প্রতিটি ইনটেক যাচাই করে তবেই ব্যবস্থা নেয়। সহায়ক যখন জরুরিত্ব অনুমান করে, সেটি প্র্যাকটিসকে সঠিক ক্রমে সাড়া দিতে সাহায্য করার একটি রাউটিং সহায়তা মাত্র — আপনার স্বাস্থ্যের মূল্যায়ন নয়, এবং এর কারণে সেবা নিতে কখনো দেরি করবেন না।"
legal.terms.s4.title: "অ্যাপয়েন্টমেন্ট"
legal.terms.s4.body: "সাইটের মাধ্যমে করা অ্যাপয়েন্টমেন্টের অনুরোধ প্র্যাকটিস নিশ্চিত না করা পর্যন্ত প্রস্তাব মাত্র। স্থান চেম্বারভেদে ভিন্ন এবং প্রতিটি বুকিংয়ে নিশ্চিত করা হয়। আসতে না পারলে যত আগে সম্ভব প্র্যাকটিসকে জানান।"
legal.terms.s5.title: "আপনার দায়িত্ব"
legal.terms.s5.body: "সঠিক ও নিজের তথ্য দিন: নিজের ইমেল ঠিকানা ব্যবহার করুন এবং পরিস্থিতি সত্যভাবে বর্ণনা করুন — আপনার জমা দেওয়া তথ্যের ভিত্তিতেই প্র্যাকটিস আপনার ভিজিটের প্রস্তুতি নেয়। সাইটটি হয়রানি, সিস্টেমে অনুপ্রবেশ বা অতিরিক্ত চাপ সৃষ্টি, কিংবা অনুমতি ছাড়া অন্য কারও তথ্য জমা দেওয়ার কাজে ব্যবহার করবেন না (সন্তানের পক্ষে মা-বাবা বা আইনি অভিভাবক কাজ করতে পারেন)।"
legal.terms.s6.title: "আপনার অ্যাকাউন্ট ও রেকর্ড"
legal.terms.s6.body: "ইমেল যাচাইয়ের পর রেকর্ড অংশে প্র্যাকটিসের কাছে থাকা আপনার তথ্য দেখা যায়। ইমেলের নিয়ন্ত্রণ নিরাপদ রাখুন — সাইট এভাবেই বোঝে আপনি আপনিই। অন্য কেউ আপনার ইমেল ব্যবহার করে রেকর্ডে ঢুকেছে মনে হলে সঙ্গে সঙ্গে প্র্যাকটিসের সঙ্গে যোগাযোগ করুন।"
legal.terms.s7.title: "দায়ের সীমা"
legal.terms.s7.body: "আমরা সাইটটি সচল ও নির্ভুল রাখতে কাজ করি, তবে এটি \"যেমন আছে\" ভিত্তিতে প্রদত্ত: নিরবচ্ছিন্ন বা ত্রুটিমুক্ত থাকার প্রতিশ্রুতি দিতে পারি না, এবং আমাদের যুক্তিসঙ্গত নিয়ন্ত্রণের বাইরের ঘটনায় বা এই শর্তাবলির পরিপন্থী ব্যবহারে সৃষ্ট ক্ষতির জন্য আমরা দায়ী নই। বাংলাদেশের আইনে যে দায় সীমিত করা যায় না, এই শর্তাবলির কোনো কিছুই তা সীমিত করে না, এবং ডা. কিয়ানা প্রকৃতপক্ষে যে সেবা দেন সে বিষয়ে তাঁর পেশাগত দায়িত্বও এতে বদলায় না।"
legal.terms.s8.title: "পরিবর্তন ও প্রযোজ্য আইন"
legal.terms.s8.body: "আমরা এই শর্তাবলি হালনাগাদ করতে পারি; উপরের সংস্করণ দেখে বুঝবেন সর্বশেষ কবে বদলেছে। গুরুত্বপূর্ণ পরিবর্তনে আমরা সাইটে নোটিশ দেব, এবং কোনো পরিবর্তন আপনার ডেটা ব্যবস্থাপনায় প্রভাব ফেললে গোপনীয়তা নীতিমালাতে বর্ণিত অনুযায়ী আবার আপনার সম্মতি চাইব। এই শর্তাবলি বাংলাদেশের আইনের অধীন এবং যেকোনো বিরোধ বাংলাদেশের আদালতের এখতিয়ারভুক্ত।"
legal.terms.s9.title: "যোগাযোগ"
legal.terms.s9.body: "এই শর্তাবলি সম্পর্কে প্রশ্ন: care@drkyana.com।"

legal.privacy.title: "গোপনীয়তা নীতিমালা"
legal.privacy.intro: "এই নীতিমালাতে ব্যাখ্যা করা হয়েছে drkyana.com কী ব্যক্তিগত ডেটা সংগ্রহ করে, কেন করে, তা কোথায় যায়, কত দিন রাখা হয় এবং আপনার কী কী সুযোগ আছে। এটি বাংলাদেশের ডেটা সুরক্ষা আইনের অধীনে প্রদত্ত। স্বাস্থ্য-তথ্য সংবেদনশীল ব্যক্তিগত ডেটা — এখানে আপনি যা জানান, আমরা তা সেভাবেই সুরক্ষিত রাখি।"
legal.privacy.s1.title: "দায়িত্বশীল কে"
legal.privacy.s1.body: "এই সাইট পরিচালনা করে ঢাকার ডা. কিয়ানার ডেন্টাল প্র্যাকটিস — বাংলাদেশ মেডিকেল ও ডেন্টাল কাউন্সিলে নিবন্ধিত (BMDC রেজিস্ট্রেশন নম্বর 15450) একজন দন্ত শল্যচিকিৎসক, যিনি ঢাকার বিভিন্ন চেম্বারে পরামর্শ দেন। আপনার ডেটার জন্য দায়বদ্ধ নিয়ন্ত্রক এই প্র্যাকটিস। যোগাযোগ: care@drkyana.com।"
legal.privacy.s2.title: "আমরা কী সংগ্রহ করি, কেন করি"
legal.privacy.s2.body: "আপনার ডেটা আমরা কেবল এসব কাজে ব্যবহার করি: আপনাকে নিবন্ধন ও যাচাই করা, দন্তচিকিৎসকের জন্য আপনার ইনটেক প্রস্তুত করা, আপনার সেবার ব্যবস্থা ও রেকর্ড রাখা, আপনার সম্মতি দেওয়া প্র্যাকটিস-ইমেল পাঠানো এবং সাইট নিরাপদ রাখা। আপনাকে আগে জিজ্ঞেস না করে অন্য কোনো কাজে ব্যবহার করি না।\n\nযা সংগ্রহ করি:\n\n• যোগাযোগ ও পরিচয়ের তথ্য — নাম, বয়স, ফোন নম্বর ও ইমেল ঠিকানা।\n• আপনার জানানো স্বাস্থ্য-তথ্য — উপসর্গ, চিকিৎসা-ইতিহাস, ওষুধ, অ্যালার্জি এবং রিসেপশনিস্টের সঙ্গে আপনার কথোপকথন।\n• ইলেকট্রনিক স্বাস্থ্য রেকর্ড — অ্যাপয়েন্টমেন্ট ও প্র্যাকটিসের প্রস্তুত করা নথি।\n• কারিগরি ডেটা — অপব্যবহার ঠেকাতে ও সেবা নিরাপদ রাখতে আপনার ডিভাইস বা সংযোগ সম্পর্কে সীমিত তথ্য।\n\nআমরা বিজ্ঞাপন ট্র্যাকার বা অ্যানালিটিক্স কুকি ব্যবহার করি না। একমাত্র কুকিটি আপনাকে সাইন-ইন রাখে।"
legal.privacy.s3.title: "AI রিসেপশনিস্ট এবং আপনার ডেটা কোথায় যায়"
legal.privacy.s3.body: "রিসেপশনিস্ট ব্যবহারের সময় আপনি যে তথ্য দেন — যেমন আপনার উপসর্গ, বয়স ও চিকিৎসা-ইতিহাস — তা Anthropic (Claude) প্রক্রিয়া করে, যা একটি AI প্রদানকারী এবং যাদের সার্ভার বাংলাদেশের বাইরে; এভাবেই সহায়ক আপনার অনুরোধ বোঝে ও ইনটেক প্রস্তুত করে। AI আপনার ইনটেকের খসড়া তৈরি ও তথ্য গোছায়; লাইসেন্সধারী দন্তচিকিৎসক সবকিছু পর্যালোচনা করে সব ক্লিনিক্যাল সিদ্ধান্ত নেন।\n\nহোস্টিং ও ইমেল পাঠানোর জন্য আমরা তৃতীয় পক্ষের প্রদানকারীর উপরও নির্ভর করি, যাদের কেউ কেউ বাংলাদেশের বাইরে পরিচালিত হয়। ফলে আপনার রেকর্ড, স্বাস্থ্য-তথ্যসহ, বাংলাদেশের বাইরে সংরক্ষিত হয়। যাচাইয়ের সময় দেওয়া আপনার সম্মতির ভিত্তিতে, এবং প্রতিটি প্রদানকারীকে কেবল আমাদের নির্দেশেই প্রক্রিয়াকরণে সীমাবদ্ধ রাখা চুক্তির অধীনে, আমরা তা স্থানান্তর করি। আপনার ডেটা আমরা বিক্রি করি না, বিজ্ঞাপনের জন্যও কারও সঙ্গে ভাগ করি না।"
legal.privacy.s4.title: "আপনার সম্মতি"
legal.privacy.s4.body: "রিসেপশনিস্ট ব্যবহারের আগে আপনি ইমেল যাচাই করেন এবং সম্মতি দেন — ইলেকট্রনিক স্বাস্থ্য রেকর্ড সংরক্ষণ, বার্তার AI প্রক্রিয়াকরণ ও প্র্যাকটিসের ইমেলের জন্য আলাদা আলাদাভাবে। প্রতিটি সম্মতি নথিভুক্ত হয় আপনি যে নির্দিষ্ট সংস্করণ ও বয়ানে সম্মত হয়েছেন এবং আপনাকে যে ভাষায় দেখানো হয়েছিল তা-সহ। ইংরেজি পাঠই প্রামাণ্য; বাংলা ও ফারসি অনুবাদ সুবিধার জন্য।\n\nআমার রেকর্ড পৃষ্ঠায় আপনি যেকোনো সময় AI প্রক্রিয়াকরণ ও প্র্যাকটিস-ইমেল চালু-বন্ধ করতে পারেন; পরিবর্তন কার্যকর হয় আপনার পরবর্তী বার্তা থেকে — কোনো কিছু প্রক্রিয়া করার আগে সাইট প্রতিবার আপনার অনুমতি যাচাই করে। ইলেকট্রনিক স্বাস্থ্য রেকর্ড সংরক্ষণের সম্মতি প্রত্যাহার করতে care@drkyana.com-এ ইমেল করুন (সহায়তা পৃষ্ঠা দেখুন); প্রত্যাহারের পরও কিছু রেকর্ড আইনত নির্দিষ্ট সময় রাখতে হয়। সম্মতি বলবৎ থাকাকালে যে প্রক্রিয়াকরণ হয়ে গেছে, প্রত্যাহার তাতে প্রভাব ফেলে না।\n\nএই সেবা প্রাপ্তবয়স্কদের জন্য। শিশুর ক্ষেত্রে মা-বাবা বা অভিভাবক নিজের ইমেল যাচাই করে, ইনটেক পূরণ করে, শিশুর পক্ষে প্রতিটি সম্মতি দেন; শিশুর কাছ থেকে সরাসরি সম্মতি আমরা জেনে-বুঝে গ্রহণ করি না।"
legal.privacy.s5.title: "ডেটা কত দিন রাখি"
legal.privacy.s5.body: "যে সংরক্ষণসীমা আমরা স্বয়ংক্রিয়ভাবে প্রয়োগ করি:\n\n• ইমেল যাচাই কোড — ১০ মিনিটে মেয়াদোত্তীর্ণ, ২ দিনের মধ্যে মুছে যায়।\n• রিসেপশনিস্টের চ্যাট ট্রান্সক্রিপ্ট — ৯০ দিন নিষ্ক্রিয় থাকলে স্বয়ংক্রিয়ভাবে মুছে যায়।\n\nইলেকট্রনিক স্বাস্থ্য রেকর্ড (ইনটেক, অ্যাপয়েন্টমেন্ট, প্রেসক্রিপশন) পেশাগত ও আইনি রেকর্ড-সংরক্ষণ মান যত দিন দাবি করে তত দিন রাখা হয়। এগুলোর মুছে ফেলা এখনো স্বয়ংক্রিয় নয়: পর্যালোচনায় বা মুছে ফেলার অনুরোধে (আপনার অধিকার দেখুন) প্র্যাকটিস সেই সংরক্ষণ নিয়ম মেনে সেগুলো সরায়।"
legal.privacy.s6.title: "আপনার অধিকার"
legal.privacy.s6.body: "আপনি পারেন: আমার রেকর্ড পৃষ্ঠায় নিজের অ্যাপয়েন্টমেন্ট ও প্রেসক্রিপশন দেখতে; ডেটার কপি চাইতে; সংশোধন চাইতে; সম্মতি প্রত্যাহার করতে; এবং রেকর্ড মুছে ফেলার অনুরোধ করতে। আমার রেকর্ড পৃষ্ঠায় সরাসরি যা নেই, তার জন্য আপনার যাচাইকৃত ঠিকানা থেকে care@drkyana.com-এ ইমেল করুন — অনুরোধ কীভাবে ও কত দ্রুত সামলানো হয়, সহায়তা পৃষ্ঠায় তার ব্যাখ্যা আছে। কোনো অনুরোধের নিষ্পত্তিতে সন্তুষ্ট না হলে বাংলাদেশের ডেটা সুরক্ষা আইনে গঠিত ডেটা সুরক্ষা কর্তৃপক্ষের কাছে অভিযোগ করার অধিকার আপনার আছে।"
legal.privacy.s7.title: "নিরাপত্তা"
legal.privacy.s7.body: "রোগীর ডেটায় প্রবেশাধিকার প্র্যাকটিসের মধ্যেই সীমিত, এবং রোগীর রেকর্ডে প্রতিটি প্রবেশ লগ হয়। আপনার তথ্য যথাযথ কারিগরি ও প্রাতিষ্ঠানিক সুরক্ষা দিয়ে আমরা রক্ষা করি। কোনো সিস্টেমই নিখুঁত নিরাপদ নয়; কোনো লঙ্ঘন আপনার ডেটা ঝুঁকিতে ফেললে আইন অনুযায়ী আপনাকে ও ডেটা সুরক্ষা কর্তৃপক্ষকে জানাব।"
legal.privacy.s8.title: "এই নীতিমালার পরিবর্তন"
legal.privacy.s8.body: "এই নীতিমালা বদলালে আমরা উপরের সংস্করণ হালনাগাদ করি। আপনি যে সংস্করণে সম্মতি দিয়েছিলেন তা রেকর্ডে থেকে যায়, ফলে কী মেনে নিয়েছিলেন তা সবসময় জানতে পারবেন। কোনো পরিবর্তন আপনার ডেটার ব্যবহারে বাস্তবিক প্রভাব ফেললে আবার আপনার সম্মতি চাইব।"

legal.support.title: "সহায়তা ও যোগাযোগ"
legal.support.intro: "মানুষের সঙ্গে কীভাবে যোগাযোগ করবেন, জরুরি অবস্থায় কী করবেন, এবং ডেটার অনুরোধ কীভাবে সামলানো হয়।"
legal.support.s1.title: "জরুরি অবস্থা"
legal.support.s1.body: "এই সাইট সার্বক্ষণিক নজরদারিতে থাকে না। তীব্র রক্তক্ষরণ, শ্বাস বা গিলতে সমস্যা সৃষ্টিকারী ফোলা, গুরুতর আঘাত বা যেকোনো জরুরি স্বাস্থ্য সমস্যায় এখনই নিকটস্থ হাসপাতালের জরুরি বিভাগে যান অথবা জাতীয় জরুরি নম্বর ৯৯৯-এ কল করুন। এই সাইটের উত্তরের অপেক্ষায় থাকবেন না।"
legal.support.s2.title: "মানুষের সঙ্গে কথা বলুন"
legal.support.s2.body: "প্র্যাকটিসকে ইমেল করুন: care@drkyana.com। আমরা সাধারণত ২ কর্মদিবসের মধ্যে উত্তর দিতে চেষ্টা করি। অ্যাপয়েন্টমেন্ট বদলাতে হলে আপনার নাম ও অ্যাপয়েন্টমেন্টের তারিখ উল্লেখ করুন।"
legal.support.s3.title: "আপনার রেকর্ড ও অনুমতি"
legal.support.s3.body: "আমার রেকর্ড পৃষ্ঠায় আপনার অ্যাপয়েন্টমেন্ট ও প্রেসক্রিপশন দেখা যায়, আর AI প্রক্রিয়াকরণ ও প্র্যাকটিস-ইমেল যেকোনো সময় চালু-বন্ধ করা যায়; পরিবর্তন কার্যকর হয় আপনার পরবর্তী বার্তা বা সাইট-ব্যবহারের সময় থেকে। ইলেকট্রনিক স্বাস্থ্য রেকর্ড সংরক্ষণের সম্মতি প্রত্যাহার করতে নিচের ডেটা-অনুরোধ পদ্ধতি ব্যবহার করুন — মনে রাখবেন, প্রত্যাহারের পরও কিছু রেকর্ড আইনত নির্দিষ্ট সময় রাখতে হয়।"
legal.support.s4.title: "ডেটার অনুরোধ: কপি, সংশোধন, মুছে ফেলা"
legal.support.s4.body: "এই সাইটে যাচাই করা ইমেল ঠিকানা থেকে care@drkyana.com-এ \"Data request\" বিষয় দিয়ে ইমেল করুন — এভাবেই আমরা বুঝি অনুরোধটি আপনারই। কী চান তা জানান: ডেটার কপি, সংশোধন, নাকি রেকর্ড মুছে ফেলা। আমরা ৩০ দিনের মধ্যে উত্তর দিই; অনুরোধ অস্বাভাবিক জটিল হলে ওই সময়ের মধ্যেই জানাব আরও কত সময় লাগবে ও কেন।\n\nমুছে ফেলার অনুরোধের পরও কিছু রেকর্ড পেশাগত বা আইনি নিয়মে নির্দিষ্ট সময় রাখতে হয়; আপনার ক্ষেত্রে তা হলে কী রাখা হলো ও কেন, তা জানিয়ে দেব।"
legal.support.s5.title: "AI রিসেপশনিস্ট নিয়ে সমস্যা"
legal.support.s5.body: "সহায়ক আপনাকে ভুল বুঝলে, অপ্রত্যাশিত আচরণ করলে বা উদ্বেগজনক কিছু বললে, সংক্ষিপ্ত বর্ণনা ও আনুমানিক সময়সহ আমাদের ইমেল করুন। প্র্যাকটিস প্রতিটি ইনটেক যাচাই করে তবেই ব্যবস্থা নেয়, আর আপনার মতো রিপোর্ট সহায়ককে উন্নত করতে সাহায্য করে।"

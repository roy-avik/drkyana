receptionist.done.title: "আপনার ইনটেক জমা হয়েছে"
receptionist.done.body: "ডা. কিয়ানার টিম নিশ্চিত করতে যোগাযোগ করবে। আপনি যেকোনো সময় আপনার রেকর্ডে এটি দেখতে পারেন।"

name = "drkyana-models"
main = "src/index.ts"
compatibility_date = "2026-05-22"
account_id = "b422dd4b2b479853ed1b0e0293120041"

# R2 binding — the bucket is the source of truth. On a cache miss the Worker
# pulls the file from huggingface.co once and writes it here; everything after
# is served straight from R2 with CF's edge cache in front.
[[r2_buckets]]
binding = "MODELS"
bucket_name = "drkyana-models"

# Daily cron at 00:00 UTC. Walks MIRROR_MANIFEST in worker/src/index.ts and
# ensures every file exists in the bucket — first run after deploy pulls all
# model files; later runs are no-ops unless we add a new model.
[triggers]
crons = ["0 0 * * *"]

# Workers Observability — captures invocation logs + a per-request timeline
# in the dashboard. Free for our traffic level; head_sampling_rate=1 means
# every invocation is captured (drop to e.g. 0.1 if we ever get noisy).
# View in dashboard: Workers → drkyana-models → Logs.
[observability]
enabled = true
head_sampling_rate = 1

# Tail with `npx wrangler tail` from this directory.
# Deploy with `npx wrangler deploy`.
# Manually trigger the cron once with:
#   npx wrangler dev --test-scheduled
# or in prod:
#   curl "https://drkyana-models.roy-ch-avik.workers.dev/__scheduled" \
#        -H "Cron-Trigger: true"  (only with the dev test endpoint)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pillow numpy

      - name: Lint locales
        run: python scripts/locales.py check

      - name: Verify optimized assets are up to date
        run: python scripts/optimize_images.py --check

      - name: Install Node deps
        run: npm ci

      - name: Isolation guard (no server-only code in client source)
        run: node scripts/check-isolation.mjs

      - name: Typecheck server package
        run: npx tsc -p packages/server/tsconfig.json

      - name: Typecheck patient
        run: npm run typecheck

      - name: Build patient
        run: npm run build

      - name: Build admin (Next.js + Serwist)
        run: npm run build --workspace=@drkyana/admin

      # Run AFTER both client bundles exist so the scan covers patient `dist`
      # AND admin `.next/static` — otherwise admin client leaks go ungated.
      - name: Isolation guard (built client bundles)
        run: node scripts/check-isolation.mjs --dist
